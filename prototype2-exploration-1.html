/* One accent, light enough to read as type as well as fill. */
:root{--bg:#0A0A0B;--ink:#EDE7DA;--accent:#A347FF;--accent-lit:#A347FF}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;cursor:none;touch-action:none;font-family:"Public Sans",ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
/* One single, continuously-growing paragraph — not a new element per pass.
   Font-size lives directly on #txt (not a child) on purpose: spawnFromSpan
   reads getComputedStyle(txt).fontSize for every falling word, so if the
   size only existed on a child element, every fallen word rendered at the
   browser default instead of its real size — that's what was making
   fallen text look shrunk. */
#txt{position:fixed;left:5vw;right:5vw;top:clamp(26px,5vh,56px);margin:0;direction:rtl;text-align:right;font-family:'Nastaliq','Noto Nastaliq Urdu',serif;font-weight:500;font-size:clamp(22px,3.6vw,52px);line-height:2.15;word-spacing:.08em}
.fall{position:fixed;left:0;top:0;direction:rtl;white-space:nowrap;font-family:'Nastaliq','Noto Nastaliq Urdu',serif;font-weight:500;pointer-events:none;will-change:transform;text-align:center}
#dot{position:fixed;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:#A347FF;pointer-events:none;display:none;z-index:9}
#play{position:fixed;right:28px;bottom:28px;width:46px;height:46px;border-radius:50%;cursor:pointer;
  background:rgba(237,231,218,.03);border:1px solid rgba(237,231,218,.3);color:#EDE7DA;
  display:flex;align-items:center;justify-content:center;z-index:10;
  transition:border-color .2s ease,opacity .2s ease,transform .15s ease,box-shadow .2s ease}
#play:hover{border-color:#A347FF;box-shadow:0 0 0 6px rgba(163,71,255,.1);transform:translateY(-1px)}
#play:active:not(:disabled){transform:scale(.93)}
#play:focus-visible{outline:1.5px solid #A347FF;outline-offset:2px}
#play:disabled{opacity:.35;cursor:default}
#play svg{width:13px;height:13px;fill:currentColor;transition:transform .15s ease}

<body>
<div id="txt"></div>
<div id="dot"></div>
<button id="play" disabled title="Play / pause">
  <svg id="playIcon" viewBox="0 0 10 10"><path d="M1 0l8 5-8 5z"/></svg>
</button>
<script>
const $=id=>document.getElementById(id);
const SENTENCE='السلام علیکم علینہ، کیا حال ہے؟ کیا ہو رہا ہے؟ پتہ ہے یہاں کیا ہو رہا ہے؟ گھر بالکل خالی ہو گیا ہے اور ساتھ ساتھ دل بھی بالکل خالی ہو گیا ہے';
// let, not const: the viewer can put their own words in (see the text field)
let WORDS=SENTENCE.split(/\s+/).filter(Boolean);
/* APPROXIMATE word start times (seconds into the recording). Used only if the recording can't be analysed. */
const ONSETS=[0,.45,1.05, 1.95,2.3,2.7, 3.55,3.85,4.1,4.45, 5.3,5.6,5.9,6.35,6.65,6.9,7.25, 8.2,8.6,9.1,9.55,9.8,10.15, 10.85,11.25,11.7,12.2,12.7,13.2,13.7,14.15,14.4,14.75];
let TAIL=2.2; const AUDIO_SRC='recording.opus', GAP=1.6, CYC=5, CAP=140;
const CYCLE_HOLD=5.5;   // seconds to sit with the full page of room tone before it wipes
let finalPass=false;    // true on the last pass of a cycle — the pile stops being trimmed
const dur=i=>(i<ONSETS.length-1?ONSETS[i+1]:ONSETS[i]+TAIL)-ONSETS[i];
const txt=$('txt');
let spans=[];
// One paragraph, the whole time — it just keeps growing, word by word,
// wrapping naturally into as many lines as the sentence needs (same as
// a real block of text). It is never written and then collapsed as two
// separate events: each line starts coming apart as the next line starts
// being written (see beginLineRelease), so at any moment there's a line
// arriving, a line leaving, words in the air and a pile underneath.
// New words fade and settle in rather than snapping into the sentence —
// a word appearing instantly read as a UI update; easing it in reads as
// something being spoken.
// Which color a sentence writes in marks which pass it's from, instead of
// a flash marking the moment it started: pass 1 writes in ink (white),
// pass 2 in accent (purple), pass 3 back to ink, and so on. Each fallen
// word keeps whatever color it had when it let go (see spawnFromSpan), so
// the pile at the bottom ends up visibly a mix of both, not uniform.
function passColor(){return (pass%2===0)?'var(--accent-lit)':'var(--ink)';}
function addWord(i){const s=document.createElement('span');s.textContent=WORDS[i];
  s.style.cssText='display:inline-block;opacity:0;transform:translateY(4px);transition:opacity .4s ease,transform .4s ease;color:'+passColor();
  txt.appendChild(s);txt.appendChild(document.createTextNode(' '));spans.push(s);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{s.style.opacity='1';s.style.transform='none';}));}

let actx,abuf,src,startT=0,playing=false,pass=0,nextW=0,waitUntil=0,finished=false,paused=true;
function ensure(){if(actx)return;actx=new (window.AudioContext||window.webkitAudioContext)();}
function demoVoice(){const sr=actx.sampleRate,len=Math.floor(sr*(ONSETS[ONSETS.length-1]+TAIL+1)),b=actx.createBuffer(1,len,sr),d=b.getChannelData(0);let ph=0;
  for(let n=0;n<len;n++){const t=n/sr;let env=0,f0=130,f1=600,f2=1700;for(let i=0;i<ONSETS.length;i++){const dt=t-ONSETS[i],L=Math.min(.5,dur(i)*.9);if(dt>=0&&dt<L){env=Math.sin(Math.PI*dt/L);f0=110+((i*47)%60);f1=380+((i*131)%700);f2=1300+((i*211)%1300);}}
    ph+=2*Math.PI*f0/sr;let s=0;for(let h=1;h<=16;h++){const fr=h*f0;s+=Math.sin(h*ph)*(Math.exp(-Math.pow((fr-f1)/260,2))+.6*Math.exp(-Math.pow((fr-f2)/420,2))+.05)/Math.pow(h,.6);}d[n]=s*.15*env;}
  return b;}
async function loadRec(arr){abuf=await actx.decodeAudioData(arr);realRec=true;estimateOnsets(abuf);}
async function tryFetch(){try{const r=await fetch(AUDIO_SRC);if(!r.ok)throw 0;await loadRec(await r.arrayBuffer());}catch(e){}}
let realRec=false,live=[],IR=null,noiseBuf=null;
function prepAudio(){
  if(IR)return;const sr=actx.sampleRate;
  IR=actx.createBuffer(2,Math.floor(sr*2.6),sr);
  for(let c=0;c<2;c++){const d=IR.getChannelData(c);let lp=0;for(let i=0;i<d.length;i++){const t=i/sr;lp+=((Math.random()*2-1)-lp)*.35;d[i]=lp*Math.exp(-t*2.6)*(i<sr*.012?i/(sr*.012):1);}}
  noiseBuf=actx.createBuffer(1,sr*3,sr);const d=noiseBuf.getChannelData(0);let b0=0;for(let i=0;i<d.length;i++){b0+=((Math.random()*2-1)-b0)*.08;d[i]=b0*4;}
}
/* ---------------- the pile still speaks -------------------------------
   Every fallen word remembers which word it is, so it still knows its
   own moment in the recording. Push one with the cursor and it says
   itself — but only as well as it still can: the longer ago it fell,
   the more of it has gone. The filter closes and the level drops with
   every pass it has lain there, so the bottom of the pile is a mumble
   and what fell a moment ago is still almost a word.

   Without this the piece hands you something to play with and the
   sound has nothing to do with it. This is the sound being the thing
   you are playing with. */
let voiceBus=null, lastVoiceAt=0, voiceCount=0;
function speakWord(rec){
  if(!actx||!abuf||!realRec) return;
  const now=performance.now();
  if(now-rec.lastHit < 420) return;            // one word can't chatter
  if(now-lastVoiceAt < 45) return;             // and the pile can't roar
  if(voiceCount>6) return;                     // cap the voices at once
  const i=rec.wi;
  if(!(i>=0 && i<ONSETS.length)) return;
  rec.lastHit=now; lastVoiceAt=now;

  const age=Math.max(0,(pass-rec.bornPass));   // passes it has been lying there
  const start=Math.max(0,ONSETS[i]-.02);
  const len=Math.min(dur(i)+.12, abuf.duration-start);
  if(len<=.03) return;

  if(!voiceBus){ voiceBus=actx.createGain(); voiceBus.gain.value=.9; voiceBus.connect(actx.destination); }
  const s=actx.createBufferSource(); s.buffer=abuf;
  const lp=actx.createBiquadFilter(); lp.type='lowpass';
  lp.frequency.value=Math.max(420, 6200*Math.pow(.62, age));
  lp.Q.value=.7;
  const g=actx.createGain();
  const vol=Math.max(.12, .95*Math.pow(.78, age));
  const t0=actx.currentTime;
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(vol,t0+.012);
  g.gain.setValueAtTime(vol,t0+len*.8);
  g.gain.linearRampToValueAtTime(0,t0+len+.06);
  s.connect(lp); lp.connect(g); g.connect(voiceBus);
  voiceCount++;
  s.onended=()=>{voiceCount=Math.max(0,voiceCount-1); try{s.disconnect();lp.disconnect();g.disconnect();}catch(e){}};
  try{ s.start(t0,start,len); s.stop(t0+len+.08); }catch(e){ voiceCount=Math.max(0,voiceCount-1); }
}
function stopAudio(){for(const n of live){try{n.onended=null;n.stop()}catch(e){}}live=[];}
/* Room passes: each time round the voice has been played into a room and recorded again.
   d runs 0 → 1: it loses its high end, wobbles like old tape, drowns in reverb and room tone.
   The last pass keeps only a slow drone made from the voice itself. */
function playPass(){
  prepAudio();stopAudio();
  const c=actx,now=c.currentTime,cyc=(pass-1)%CYC,d=cyc/(CYC-1);
  const out=c.createGain();out.gain.value=1;out.connect(c.destination);
  const mk=(rate,loop)=>{const s=c.createBufferSource();s.buffer=abuf;s.playbackRate.value=rate;s.loop=!!loop;live.push(s);return s;};
  src=mk(1);
  const vg=c.createGain();vg.gain.value=1-.92*Math.pow(d,1.15);
  const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=16000*Math.pow(.04,d);lp.Q.value=.4;
  const dry=c.createGain();dry.gain.value=1-.6*d;
  const conv=c.createConvolver();conv.buffer=IR;const wet=c.createGain();wet.gain.value=.12+.95*d;
  src.connect(vg);vg.connect(lp);lp.connect(dry);dry.connect(out);lp.connect(conv);conv.connect(wet);wet.connect(out);
  const lfo=c.createOscillator();lfo.frequency.value=.3+d*.6;const lg=c.createGain();lg.gain.value=d*60;lfo.connect(lg);lg.connect(src.detune);lfo.start(now);live.push(lfo);
  const ns=c.createBufferSource();ns.buffer=noiseBuf;ns.loop=true;live.push(ns);
  const nl=c.createBiquadFilter();nl.type='lowpass';nl.frequency.value=700+d*500;const ng=c.createGain();ng.gain.value=.003+.045*Math.pow(d,1.2);
  ns.connect(nl);nl.connect(ng);ng.connect(out);ns.start(now);
  startT=now+.05;
  src.start(startT);
  finalPass = (cyc===CYC-1);   // the room-tone pass: let the pile fill the page
  rollPassFeel();              // this pass falls and settles unlike the last one
  // the previous sentence keeps coming apart word by word while this one writes
  handOverParagraph();
  if(cyc===CYC-1){                 // the drone: the voice slowed to half speed, heavily filtered, left in the room
    const dr=mk(.5,true),dl=c.createBiquadFilter();dl.type='lowpass';dl.frequency.value=380;const dg=c.createGain();dg.gain.setValueAtTime(0,startT);dg.gain.linearRampToValueAtTime(.7,startT+3);
    dr.connect(dl);dl.connect(dg);dg.connect(out);dg.connect(conv);dr.start(startT);
  }
  playing=true;nextW=0;
}
function passEnd(){return realRec?abuf.duration+.2:ONSETS[ONSETS.length-1]+TAIL;}
/* when a real recording is loaded, estimate where each word starts: find the voiced stretches,
   then share them out between the words by length of word. Replace with marked times if you have them. */
function estimateOnsets(buf){
  const ch=buf.getChannelData(0),sr=buf.sampleRate,win=Math.floor(sr*.02),n=Math.floor(ch.length/win),e=new Float32Array(n);
  for(let i=0;i<n;i++){let a=0;for(let j=0;j<win;j++){const v=ch[i*win+j];a+=v*v;}e[i]=Math.sqrt(a/win);}
  const sm=new Float32Array(n);for(let i=0;i<n;i++){let a=0,k=0;for(let j=-2;j<=2;j++)if(e[i+j]!==undefined){a+=e[i+j];k++;}sm[i]=a/k;}
  const so=Array.from(sm).sort((x,y)=>x-y),floor=so[Math.floor(n*.1)],peak=so[Math.floor(n*.95)],thr=floor+(peak-floor)*.12;
  let v=Array.from(sm,x=>x>thr);
  for(let i=0;i<n;i++)if(!v[i]){let j=i;while(j<n&&!v[j])j++;if(i>0&&j<n&&j-i<7)for(let k=i;k<j;k++)v[k]=true;i=j;}
  const segs=[];for(let i=0;i<n;i++)if(v[i]){let j=i;while(j<n&&v[j])j++;if(j-i>=4)segs.push([i,j]);i=j;}
  const total=segs.reduce((a,s)=>a+s[1]-s[0],0);
  if(!segs.length||total*.02<1.5)return false;
  const wts=WORDS.map(w=>Array.from(w).length+1),sum=wts.reduce((a,b)=>a+b,0);
  const at=off=>{let o=off*total;for(const s of segs){const L=s[1]-s[0];if(o<=L)return (s[0]+o)*.02;o-=L;}return segs[segs.length-1][1]*.02;};
  let acc=0;const out=[];for(let i=0;i<WORDS.length;i++){out.push(at(acc/sum));acc+=wts[i];}
  for(let i=0;i<out.length;i++)ONSETS[i]=out[i];
  TAIL=Math.max(1,at(1)-out[out.length-1]);
  return true;
}


/* ================= PHYSICS (Matter.js) =================
   Like the reference: the text sits still until the ball reaches it. Words the ball touches come away and float off,
   pushed along by a soft field around the ball (not a hard hit). Gravity is light and the air is thick, so everything
   drifts, turns slowly and settles gently. */
const {Engine,Bodies,Body,Composite}=Matter;
let eng,floorY=0,walls=[],olds=[],ptr={x:-300,y:-300,on:false,vx:0,vy:0,px:-300,py:-300},lastF=0,acc=0;
let dotX=-300,dotY=-300; // eased cursor position — see frame(), trails ptr.x/y rather than snapping to it
const FIELD=240;    // how far the cursor's shove reaches into the pile (was 140)
const TOUCH=46;     // how close it has to get to take a word out of the standing sentence
function world(){
  const W=innerWidth,H=innerHeight,t=300;floorY=H-4;
  if(!eng)eng=Engine.create({gravity:{x:0,y:1,scale:.00033},positionIterations:6,velocityIterations:4});
  Composite.remove(eng.world,walls);
  walls=[Bodies.rectangle(W/2,floorY+t/2,W*3,t,{isStatic:true,friction:.7,restitution:.2,collisionFilter:{category:1,mask:2}}),
    Bodies.rectangle(-t/2,H/2,t,H*5,{isStatic:true,collisionFilter:{category:1,mask:2}}),
    Bodies.rectangle(W+t/2,H/2,t,H*5,{isStatic:true,collisionFilter:{category:1,mask:2}})];
  Composite.add(eng.world,walls);
}
/* Turn one word of the sentence on screen into a body. The word keeps its
   exact position, size and colour — the clone is made where the original
   stood, and the original is only hidden once the clone exists.

   delay < 0 means: make the clone and the body NOW, but leave it frozen
   where it is until release() is called. That's what lets a word keep its
   own place in the queue across a pass boundary instead of being dumped
   with everything else — it's already out of the paragraph, just not
   falling yet. Returns a handle so the caller can release it later. */
function spawnFromSpan(s,delay,vx,vy){
  if(s.dataset.gone)return null;s.dataset.gone=1;
  const fs=parseFloat(getComputedStyle(txt).fontSize),r=s.getBoundingClientRect(),w=Math.max(8,r.width*.96),h=fs*.74;
  // per-pass physics character, so one pass's pile doesn't settle like the last one's
  const fr=PASS_FEEL.friction, air=PASS_FEEL.air, rest=PASS_FEEL.rest;
  const b=Bodies.rectangle(r.left+r.width/2,r.top+r.height/2,w,h,{restitution:rest,friction:fr,frictionAir:air,density:.0016,chamfer:{radius:4}});
  Body.setStatic(b,true);b.collisionFilter.category=4;b.collisionFilter.mask=0;
  const el=document.createElement('div');el.className='fall';el.textContent=WORDS[+s.dataset.i];el.style.width=r.width+'px';el.style.fontSize=fs+'px';
  el.style.color=getComputedStyle(s).color;   // carries over the pass's color (white or purple) into the pile
  el.style.height=h+'px';el.style.lineHeight=(h*1.2)+'px';document.body.appendChild(el);
  const rec={el,b,w:r.width,h,leaving:false,held:true,wi:+s.dataset.i,bornPass:pass,lastHit:0};
  Composite.add(eng.world,b);olds.push(rec);
  s.style.visibility='hidden';
  const go=()=>{if(!rec.held)return;rec.held=false;
    Body.setStatic(b,false);b.collisionFilter.category=2;b.collisionFilter.mask=1|2;
    Body.setVelocity(b,{x:vx+PASS_FEEL.wind,y:vy});Body.setAngularVelocity(b,(Math.random()-.5)*PASS_FEEL.spin);};
  rec.release=go;
  if(delay<0) return rec;            // held: caller releases it on its own schedule
  if(delay>0)setTimeout(go,delay);else go();
  return rec;
}
/* ================= FALLING LOGIC =================
   Writing and disintegration are one process, not two. A line is released
   the moment the next line starts being written, and that release is
   spread over seconds — so the paragraph is always part intact and part
   gone, and the older a line is, the less of it is left. Nothing waits
   for the recording to finish.

   Three states are kept apart deliberately: words still being written
   (spans, in the paragraph), words written but scheduled to go (still in
   the paragraph, queued in relQ), and detached bodies (olds, Matter).
   A word only ever leaves the paragraph's layout by becoming its own
   fixed-position clone, so releasing one never reflows the line that's
   still being written.

   The RHYTHM of the release is what's dramatic: a fixed pattern of group
   sizes repeats — mostly single words, with occasional bursts of two or
   three — so it doesn't just wipe left-to-right, it reads as uneven: a
   word slips, a pause, two go together, a pause, one again. WHICH words
   land in which group is reshuffled every pass.

   Low bounce / high friction (see spawnFromSpan) means everything that
   lands stays roughly where it fell — it piles up on the ground rather
   than rolling away. */
/* Every pass gets its own physical character — a prevailing drift, how
   much the air holds the words up, how far they skid when they land, how
   much they turn. Without this, every pass falls the same way and the
   pile always ends up the same heap in the same place. Re-rolled at the
   start of each pass, so each layer of the pile lands differently from
   the one under it. */
const PASS_FEEL={wind:0,friction:.55,air:.058,rest:.2,spin:.018};
function rollPassFeel(){
  const r=Math.random;
  PASS_FEEL.wind     = (r()-.5)*1.5;          // which way this pass drifts
  PASS_FEEL.friction = .18+r()*.55;           // low = words skid and spread out on landing
  PASS_FEEL.air      = .030+r()*.055;         // high = hangs and drifts, low = drops
  PASS_FEEL.rest     = .05+r()*.34;           // how much it bounces off the heap
  PASS_FEEL.spin     = .010+r()*.055;         // how much it tumbles
}
const GROUP_PATTERN = [1,1,2,1,1,3,1,2,1,1,2,1,3,1,1];
let groupCursor = 0;        // persists across passes so the rhythm keeps rolling forward

let lines=[], curLine=null;
let relQ=[];        // words scheduled to let go: {s, t, phase, vx, vy}
let relClock=0;     // milliseconds, but only counts while playing — see stepPhys

/** Line N starts coming apart the moment line N+1 starts being written.
    The whole line doesn't go at once: its words are shuffled, dealt out
    in the GROUP_PATTERN rhythm (mostly singles, the odd pair or triple)
    and spread over several seconds, so the next line is still arriving
    while this one is still leaving. Some words are gone early, some are
    still sitting in place when the line below them starts to go too.

    speed compresses that spread — used at the end of a pass, where the
    last line has only the gap between passes to clear out. */
function beginLineRelease(line, speed=1){
  if(!line || line.releasing) return;
  line.releasing=true;
  const pool=line.spans.filter(s=>!s.dataset.gone);
  if(!pool.length) return;
  for(let i=pool.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[pool[i],pool[j]]=[pool[j],pool[i]];}

  // whatever is still pending from older lines gets pulled forward — by a
  // different amount each time, so the overlap between one line leaving
  // and the next isn't the same shape on every pass
  const pull = .58+Math.random()*.28;
  for(const q of relQ) q.t = relClock + (q.t-relClock)*pull;

  /* Stragglers. Within a line the order was already shuffled, but every
     line still emptied before the next one started, so the paragraph
     always came apart top-down in the same sweep. A couple of words per
     line are now held back far longer than the rest — long enough to
     still be standing while the line below them, and sometimes the one
     below that, are already going. That's what makes the order genuinely
     different every time rather than just the shuffle within each row. */
  const nStrag = pool.length>3 ? 1+((Math.random()*2)|0) : 0;
  const strag = new Set();
  while(strag.size<nStrag) strag.add((Math.random()*pool.length)|0);

  let t=relClock+260/speed, idx=0;
  while(idx<pool.length){
    const size=Math.min(GROUP_PATTERN[groupCursor%GROUP_PATTERN.length], pool.length-idx);
    groupCursor++;
    pool.slice(idx,idx+size).forEach((s,k)=>{
      const at=idx+k;
      const hold = strag.has(at) ? (2600+Math.random()*5200) : 0;
      relQ.push({s, t:t+(k*90+Math.random()*120)/speed + hold, phase:0,
                 vx:(Math.random()-.5)*.22, vy:.02+Math.random()*.03});
    });
    idx+=size;
    t += (420 + size*180 + Math.random()*520)/speed;
  }
}

/** Two-stage, so a word doesn't teleport from set in a sentence to falling
    object: first it slips — loosens a few pixels out of true where it
    stands, still part of the paragraph — and only then, a beat later, it
    actually detaches. The beat is different for every word, so a few hang
    on visibly longer than their neighbours. */
function stepRelease(){
  for(let i=relQ.length-1;i>=0;i--){
    const q=relQ[i];
    if(relClock<q.t) continue;
    // already detached from a finished pass — just let it go when due
    if(q.held){ q.held.release(); relQ.splice(i,1); continue; }
    if(!q.s || q.s.dataset.gone){ relQ.splice(i,1); continue; }
    if(q.phase===0){
      q.s.style.transition='transform .22s ease, opacity .22s ease';
      q.s.style.transform=`translate(${(Math.random()-.5)*3}px,${2+Math.random()*3}px) rotate(${(Math.random()-.5)*.8}deg)`;
      q.s.style.opacity='.88';
      q.phase=1;
      q.t=relClock+140+Math.random()*260;
    } else {
      spawnFromSpan(q.s,0,q.vx,q.vy);
      relQ.splice(i,1);
    }
  }
}

/** Pass boundary. Nothing is dumped here — a whole sentence hitting the
    floor at once was the thing that read as a glitch rather than as
    disintegration.

    Instead every word still standing is DETACHED: its clone is made
    where it stands and frozen there, out of the paragraph but not yet
    falling, and it keeps its own place in the release queue. Words that
    were already queued keep the time they had. Words that hadn't been
    scheduled yet get one, spread out at the normal pace. So the previous
    sentence carries on coming apart one word at a time while the next
    one is already being written over it. */
function handOverParagraph(){
  // already queued: detach in place, keep the scheduled moment
  for(const q of relQ){
    if(q.held || !q.s || q.s.dataset.gone) continue;
    const h=spawnFromSpan(q.s,-1,q.vx,q.vy);
    if(h){ q.held=h; q.s=null; }
  }
  // never scheduled: give them one now
  const left=spans.filter(s=>!s.dataset.gone);
  for(let i=left.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[left[i],left[j]]=[left[j],left[i]];}
  left.forEach((s,i)=>{
    const h=spawnFromSpan(s,-1,(Math.random()-.5)*.22,.02+Math.random()*.03);
    if(h) relQ.push({held:h, t:relClock+200+i*150+Math.random()*180, phase:1});
  });
  spans=[]; lines=[]; curLine=null; txt.textContent='';

  /* The in-between. Dropping the whole sentence at the boundary read as a
     glitch; letting all of it drift down over the next sentence buried
     the new one. So: the bulk of what's left clears within the gap, near
     enough a clean slate by the time the next sentence starts writing —
     but the last two or three hang on well past it, so there's always a
     thread of the old one still coming down while the new one arrives.
     Which words those are is chosen fresh every pass. */
  const pending=relQ.filter(q=>q.held);
  pending.sort((a,b)=>a.t-b.t);
  const keep=Math.min(pending.length, 2+((Math.random()*2)|0));
  const bulk=pending.length-keep;
  pending.forEach((q,i)=>{
    q.t = i<bulk
      ? relClock + 150 + (bulk<2?0:(i/(bulk-1))*(GAP*1000-500)) + Math.random()*160
      : relClock + GAP*1000 + 900 + Math.random()*5200;    // the stragglers
  });
  cullPile();
}

/** The pile is only trimmed mid-cycle. On the last pass — the one where
    all you can hear is room tone — nothing is culled, so the words are
    allowed to keep stacking up and fill the page before the whole thing
    fades and starts over. */
function cullPile(){
  if(finalPass) return;
  const live=olds.filter(o=>!o.leaving);
  for(let k=0;k<live.length-CAP;k++){live[k].leaving=true;live[k].b.collisionFilter.mask=0;}
}

/** After a resize the browser re-wraps the paragraph, so which words share
    a line changes — re-derive it from the new geometry instead of trusting
    the grouping made at the old width. */
function regroupLines(){
  const standing=spans.filter(s=>!s.dataset.gone);
  lines=[]; curLine=null;
  for(const s of standing){
    const top=s.offsetTop;
    if(!curLine||Math.abs(top-curLine.top)>4){curLine={top,spans:[s],releasing:false};lines.push(curLine);}
    else curLine.spans.push(s);
  }
  for(const l of lines) l.releasing = l.spans.some(s=>relQ.some(q=>q.s===s));
}
function stepPhys(){
  const now=performance.now(),dt=Math.min(.1,(now-lastF)/1000);lastF=now;acc+=dt;
  // the release clock runs on the same dt as the physics, and stepPhys is
  // only called while playing — so pausing freezes the disintegration
  // schedule exactly where it was, in step with the voice and the bodies
  relClock+=dt*1000; stepRelease();
  // smoothed ball velocity (px per frame)
  ptr.vx=ptr.vx*.75+(ptr.x-ptr.px)*.25;ptr.vy=ptr.vy*.75+(ptr.y-ptr.py)*.25;ptr.px=ptr.x;ptr.py=ptr.y;
  // The cursor reaches into the standing sentence again: run it through
  // the text as it's being written and the words it touches come away in
  // your hand, thrown in whatever direction you were moving. Only words
  // already written are takeable — the one currently arriving is left
  // alone, so you're pulling the sentence apart rather than interrupting
  // it being spoken.
  if(ptr.on&&spans.length){
    for(let i=0;i<spans.length-1;i++){
      const s=spans[i]; if(s.dataset.gone) continue;
      // cached: a word never moves once the browser has placed it, so
      // measuring all of them every frame would force a layout per word
      // per frame for nothing. Cleared on resize, when they do move.
      let c=s._hit;
      if(!c){ const r=s.getBoundingClientRect();
        c=s._hit={x:r.left+r.width/2, y:r.top+r.height/2, r:TOUCH+r.width*.3}; }
      const dx=c.x-ptr.x, dy=c.y-ptr.y;
      if(dx*dx+dy*dy < c.r*c.r){
        const h=spawnFromSpan(s,0, ptr.vx*.06+(Math.random()-.5)*.3, ptr.vy*.05+.02);
        if(h){ speakWord(h);                    // pulled out of the line, it says itself on the way
          for(let k=relQ.length-1;k>=0;k--) if(relQ[k].s===s) relQ.splice(k,1); }
      }
    }
  }
  let n=0;while(acc>=1/60&&n<4){
    if(ptr.on)for(const o of olds){
      const b=o.b;if(b.isStatic||o.leaving)continue;
      const dx=b.position.x-ptr.x,dy=b.position.y-ptr.y,d=Math.hypot(dx,dy)||1;
      if(d<FIELD){const u=1-d/FIELD,f=u*u*1.5,nx=dx/d,ny=dy/d;   // was .42 — the pile shoves around properly now
        const ax=nx*f-ny*f*.22+ptr.vx*.055*u,ay=ny*f+nx*f*.22+ptr.vy*.055*u;
        b.force.x+=b.mass*ax/277.8;b.force.y+=b.mass*ay/277.8;
        /* It only speaks if you actually move it. Resting the cursor on
           the pile does nothing; dragging through it is what disturbs
           the words, which is the right way round — you have to reach
           in. Threshold is on the cursor's speed AND how close it is. */
        const shove=Math.hypot(ptr.vx,ptr.vy)*u;
        if(shove>7) speakWord(o);}
    }
    for(const o of olds)if(!o.b.isStatic)Body.setAngularVelocity(o.b,o.b.angularVelocity*.985);
    Engine.update(eng,1000/60);acc-=1/60;n++;}
  if(n>=4)acc=0;
  for(let i=olds.length-1;i>=0;i--){const o=olds[i],p=o.b.position;
    if(o.leaving&&p.y>innerHeight+260){Composite.remove(eng.world,o.b);o.el.remove();olds.splice(i,1);continue;}
    o.el.style.transform=`translate(${p.x-o.w/2}px,${p.y-o.h/2-o.h*.1}px) rotate(${o.b.angle}rad)`;}
}

/* ================= START / LOOP ================= */
let started=false;
function startAll(){ pass=1;finished=false;playPass(); }
function frame(){
  requestAnimationFrame(frame);
  // cursor easing runs unconditionally — even while paused — so the dot
  // always feels alive and never freezes mid-chase the way an instant
  // snap-to-pointer would once it's lagging behind a fast mouse move.
  dotX+=(ptr.x-dotX)*.35; dotY+=(ptr.y-dotY)*.35;
  $('dot').style.transform=`translate(${dotX}px,${dotY}px)`;
  if(paused)return;                 // explicit pause freezes physics AND the voice's clock together
  stepPhys();
  if(!started||!abuf)return;
  let t=0;
  if(playing){
    t=actx.currentTime-startT;
    while(nextW<WORDS.length&&t>=ONSETS[nextW]){addWordI(nextW);nextW++;}
    if(t>passEnd()){
      playing=false;
      // the voice has stopped, so nothing is being written any more — the
      // last line has no next line to trigger it, so it goes here, at the
      // SAME unhurried pace as every other line. It used to be compressed
      // to fit the gap, which is what made the end of a sentence land all
      // at once; anything still standing is handed over word by word at
      // the pass boundary instead.
      if(curLine){beginLineRelease(curLine);curLine=null;}
      // on the room-tone pass, hold on the full page before wiping it
      waitUntil=performance.now()+(finalPass?CYCLE_HOLD:GAP)*1000;
    }
  } else if(waitUntil>0&&performance.now()>=waitUntil){
    waitUntil=0;
    if(finalPass){ fadeAndRestart(); }
    else { pass++;playPass(); }
  }
}

/* End of a cycle: the page is full, the room tone has had its moment —
   everything fades together and it begins again from the clean voice.
   The fade is on the elements, not the physics, so the pile keeps
   settling very slightly as it goes, rather than freezing then vanishing. */
let wiping=false;
function fadeAndRestart(){
  if(wiping) return;
  wiping=true;
  for(const o of olds){ o.el.style.transition='opacity 2.4s ease'; o.el.style.opacity='0'; }
  for(const q of relQ) if(q.held){ q.held.el.style.transition='opacity 2.4s ease'; q.held.el.style.opacity='0'; }
  if(txt) txt.style.transition='opacity 2.4s ease', txt.style.opacity='0';
  setTimeout(()=>{
    for(const o of olds){ Composite.remove(eng.world,o.b); o.el.remove(); }
    olds.length=0; relQ=[]; spans=[]; lines=[]; curLine=null;
    txt.textContent=''; txt.style.transition=''; txt.style.opacity='1';
    wiping=false; finalPass=false;
    pass=1; playPass();
  },2600);
}
/* Each word is filed under the line it ACTUALLY rendered on — read from
   s.offsetTop, never from a word count, so Urdu shaping and any screen
   width are handled by the browser's own line breaking. offsetTop (not
   getBoundingClientRect) on purpose: it ignores the little entrance
   transform each word animates in with, so a word's line is stable from
   the first frame it exists.

   The moment a word lands on a NEW line, the line above it stops being
   written and starts coming apart — that handoff is the whole piece. */
function addWordI(i){
  addWord(i);
  const s=spans[spans.length-1];
  s.dataset.i=i;
  const top=s.offsetTop;
  if(!curLine || Math.abs(top-curLine.top)>4){
    const prev=curLine;
    curLine={top,spans:[s],releasing:false};
    lines.push(curLine);
    if(prev) beginLineRelease(prev);          // the previous line begins to go as this one begins to arrive
  } else {
    curLine.spans.push(s);
  }
}
function setPlayIcon(isPlaying){
  $('playIcon').innerHTML = isPlaying
    ? '<path d="M1 0h3v10H1zM6 0h3v10H6z"/>'
    : '<path d="M1 0l8 5-8 5z"/>';
}
/* explicit play/pause only — no autoplay on first tap/key. Pausing suspends
   the audio context (so its clock, and the word timings keyed to it, freeze
   exactly where they were) and the physics loop at the same time, so nothing
   drifts out of sync while paused. */
function doPlay(){
  if(!abuf)return;
  ensure(); if(actx.state==='suspended')actx.resume();
  if(!started){ started=true; startAll(); }
  paused=false; lastF=performance.now();
  setPlayIcon(true);
}
function doPause(){
  paused=true;
  if(actx)actx.suspend();
  setPlayIcon(false);
}
$('play').addEventListener('click',()=>{ paused?doPlay():doPause(); });
async function boot(){
  ensure();
  await tryFetch(); if(!abuf)abuf=demoVoice();
  try{await document.fonts.load('500 40px Nastaliq',SENTENCE);}catch(e){}
  world();lastF=performance.now();requestAnimationFrame(frame);
  $('play').disabled=false;
}
// Only the TARGET updates here; frame() renders the eased position every
// tick regardless of pause state, so the dot always tracks the mouse (see
// the note above frame() — this used to freeze at top-left while paused).
function setPtr(e){ptr.x=e.clientX;ptr.y=e.clientY;ptr.on=true;$('dot').style.display='block';
  if(dotX<-200){dotX=ptr.x;dotY=ptr.y;}}   // first move: snap in instead of sliding in from the corner
addEventListener('pointermove',setPtr);addEventListener('pointerdown',setPtr);
addEventListener('pointerleave',()=>{ptr.on=false;$('dot').style.display='none';});
addEventListener('pointerup',e=>{if(e.pointerType==='touch'){ptr.on=false;$('dot').style.display='none';}});
addEventListener('resize',()=>{if(eng)world();for(const s of spans)s._hit=null;regroupLines();});

/* drop an audio file anywhere on the page to use it instead */
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',async e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(!f)return;ensure();
  try{await loadRec(await f.arrayBuffer());stopAudio();started=false;txt.textContent='';spans=[];relQ=[];lines=[];curLine=null;waitUntil=0;doPlay();}catch(err){}});
boot();
</script>
</body>
